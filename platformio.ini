; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    olkal/HX711_ADC@^1.2.12
monitor_speed = 115200
upload_speed = 1500000
build_type = debug
; debug_tool = esp-builtin
build_unflags = -std=gnu++11  ; Remove the default standard
build_flags = 
    -DDEBUG=1
    ; try out different optimize flags for best size and speed. default is -Os
	; -O0 ; no optimizations, useful for debugging
	; -Os ; optimize for size
	; -Og ; some optimizations without ruining debugging, used for debugging. try first, if not go zero optimizations.
	; -O3 ; aggressive optimizations
	-Ofast ; most aggressive optimizations, may cause bugs and floating point imprecision
    -std=gnu++2a ; 2a is 20. cant add new standard unless old one is removed as it will be prioritized and compiled with